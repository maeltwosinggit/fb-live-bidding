name       = "fb-live-bidding-worker"
main       = "src/index.js"
compatibility_date = "2024-01-01"

# D1 binding — create with:
#   wrangler d1 create fb-bidding-db
# then paste the database_id returned below.
[[d1_databases]]
binding      = "DB"          # accessed as env.DB inside the Worker
database_name = "fb-bidding-db"
database_id  = "PASTE_YOUR_D1_DATABASE_ID_HERE"
